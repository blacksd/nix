# https://taskfile.dev

version: "3"

vars:
  REBUILD_CMD:
    sh: '[ "{{OS}}" = "darwin" ] && echo "darwin-rebuild" || echo "nixos-rebuild"'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  build:
    desc: Just build the system configuration
    cmds:
      - sudo {{.REBUILD_CMD}} build --flake .#{{- .HOSTNAME -}} {{- .CLI_ARGS }}

  diff:
    desc: Build and show configuration changes (using nvd)
    cmds:
      - task: build
      - nvd diff /run/current-system ./result

  switch:
    desc: Build and apply the system configuration
    cmds:
      - sudo {{.REBUILD_CMD}} switch --flake .#{{- .HOSTNAME -}} {{- .CLI_ARGS }}

  plist-drift:
    desc: Show macOS settings that differ from the nix-plist-manager config (hosts/<host>/macos.nix, hosts/<host>/home-manager/macos.nix)
    vars:
      TMP:
        sh: mktemp -d
      HOST:
        # Truman shares Cydonia's host config until decommissioned
        sh: h=$(scutil --get LocalHostName); [ "$h" = Truman ] && h=Cydonia; echo "$h"
    cmds:
      - defer: rm -rf {{.TMP}}
      # Evaluate the modules' own definitions: the merged option tree also contains upstream removed options that throw.
      - nix eval -f hosts/{{.HOST}}/macos.nix --arg nix-plist-manager '{}' --arg config '{}' --arg username '""' --arg hostname '""' programs.nix-plist-manager.options > {{.TMP}}/system.nix
      - nix eval -f hosts/{{.HOST}}/home-manager/macos.nix --arg nix-plist-manager '{}' programs.nix-plist-manager.options > {{.TMP}}/user.nix
      - nix run github:sushydev/nix-plist-manager#current -- --scope system --against {{.TMP}}/system.nix
      - nix run github:sushydev/nix-plist-manager#current -- --scope user --against {{.TMP}}/user.nix

  update:
    desc: Run flake update (specify an argument after '--' for updating a single package)
    cmds:
      - nix flake update {{ .CLI_ARGS }}

  live_on_the_edge:
    desc: Update nixpkgs-unstable channel
    cmds:
      - nix flake update nixpkgs-unstable llm-agents
      # - nix flake lock --update-input nixpkgs-unstable

  gc:
    desc: Garbage collect
    cmds:
      # garbage collect all unused nix store entries(system-wide)
      - sudo nix-collect-garbage --delete-older-than 45d
      # garbage collect all unused nix store entries(for the user - home-manager)
      # https://github.com/NixOS/nix/issues/8508
      - nix-collect-garbage --delete-older-than 45d

  fmt:
    desc: Format all nix files
    cmds:
      - nix fmt

  repl:
    desc: Run a REPL shell for the flake
    cmds:
      - nix repl -f flake:nixpkgs

  # Installing Nix, Homebrew and nix-darwin on a fresh Mac lives in the Makefile (`make help`):
  # `task` itself only exists after the first switch.

  uninstall:
    desc: Remove nix darwin
    prompt:
      - This will remove nix-darwin. Are you sure?
    cmds:
      - sudo nix --extra-experimental-features "nix-command flakes" run nix-darwin#darwin-uninstaller

  uninstall_nix:
    desc: Remove nix
    prompt:
      - This will remove Nix entirely! Are you sure?
    cmds:
      - sudo -i nix-env --uninstall nix

  sops_updatekeys:
    desc: Re-encrypt every sops file for the recipients currently listed in .sops.yaml
    cmds:
      - git ls-files -z '*.sops' '*.sops.yaml' ':!.sops.yaml' | xargs -0 -n1 sops updatekeys --yes

  update_ccstatusline_config:
    desc: Update ccstatusline config
    cmds:
      - npx -y ccstatusline@latest config --config ./modules/home-manager/shared/claude-code/settings/ccstatusline.settings.json
