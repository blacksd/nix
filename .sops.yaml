creation_rules:
  # Truman's keys go when it is decommissioned
  - path_regex: hosts\/Cydonia\/secrets\/.*\.sops(?:\.yaml)*$
    key_groups:
      - age:
          - *Cydonia
          - *Cydonia_backup
          - *Truman
          - *Truman_backup
  - path_regex: hosts\/simpleton\/secrets\/.*\.sops(?:\.yaml)*$
    key_groups:
      - age:
          - *simpleton
          - *simpleton_backup
  - path_regex: modules\/home-manager\/shared\/secrets\/.*\.sops(?:\.yaml)*$
    key_groups:
      - age:
          - *Cydonia
          - *Cydonia_backup
          - *Truman
          - *Truman_backup
          - *simpleton
          - *simpleton_backup
